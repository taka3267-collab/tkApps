<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>おでかけ日記 Trippacy</title>
<meta property="og:title" content="おでかけ日記 Trippacy">
<meta property="og:description" content="おでかけの地図と訪れた場所をたどれます">
<meta property="og:image" content="https://taka3267-collab.github.io/tkApps/trippacy/icon.png">
<link rel="icon" href="../icon.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<!--
  おでかけ日記アプリ（Trippacy）の「共有」で作ったリンクを開くページ。

  おでかけの中身はリンクの「#」より後ろに入っている（deflate で圧縮して base64url にした JSON）。
  「#」より後ろはブラウザがサーバーへ送らないので、GitHub Pages を含め、どこのサーバーにも記録は残らない。
  このページは受け取った中身をブラウザの中で表示するだけ。

  形式（v1。リンクは "#1" + データ）:
    l: 言語 "ja" | "en"
    t: タイトル, d: 日付, r: 地域（なければ省略）, g: タグ, m: 思い出ノート
    p: 場所 [名前, 地域, 時刻, 日の見出し, 緯度, 経度, メモ]
    b: 長距離移動（破線にする）区間の番号。i なら場所 i → i+1
    nr: 1 なら推定ルートを描かない
-->
<style>
:root{--bg:#FBF7EF;--card:#FFFEFB;--accent:#C2502A;--accent-soft:rgba(194,80,42,.14);--text:#1E1B17;--sub:#726B61;--line:rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#141210;--card:#2B2622;--accent:#E8714A;--accent-soft:rgba(232,113,74,.18);--text:#F3EFE8;--sub:#A59E94;--line:rgba(255,255,255,.1)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
header{padding-top:28px}
h1{font-size:28px;line-height:1.25;margin:0 0 6px;overflow-wrap:anywhere}
h2{font-size:20px;margin:32px 0 12px}
.sub{margin:0;color:var(--sub)}
.tags{margin:12px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px;padding:4px 12px;border-radius:999px}
#map-section{margin-top:20px}
#map-frame{height:300px;border-radius:16px;overflow:hidden;background:var(--line)}
#map{width:100%;height:100%}
.caption{font-size:12px;color:var(--sub);margin:6px 0 0}
button{font:inherit;cursor:pointer}
.primary{background:var(--accent);color:#fff;border:0;border-radius:999px;font-weight:700}
#tour-start{display:block;width:100%;height:56px;margin-top:14px;font-size:18px}
.note{white-space:pre-wrap;margin:0;background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 1px 3px var(--line);overflow-wrap:anywhere}
.timeline{list-style:none;margin:0;padding:0}
.day{color:var(--sub);margin:18px 0 10px;font-weight:600}
.day:first-child{margin-top:0}
.stop{display:flex;gap:12px;position:relative;padding-bottom:22px;cursor:pointer}
.stop:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--accent-soft)}
.rail{flex:none;width:28px}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:14px}
.info{flex:1;min-width:0}
.info time,.tour-text time{color:var(--accent);font-weight:600;font-size:15px}
.info h3,.tour-text h3{margin:0;font-size:19px;line-height:1.35;overflow-wrap:anywhere}
.region{margin:2px 0 0;color:var(--sub);font-size:14px}
.memo{margin:8px 0 0;padding-left:10px;border-left:2px solid var(--accent);color:var(--sub);font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
footer{padding:28px 16px 40px;text-align:center;font-size:13px;color:var(--sub)}
footer a{color:var(--sub)}
.message{padding:80px 24px;text-align:center;color:var(--sub)}
.pin{min-width:30px;height:30px;padding:0 7px;border-radius:999px;border:3px solid #fff;background:var(--accent);color:#fff;font:700 14px/24px -apple-system,sans-serif;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer}
.pin.current{min-width:40px;height:40px;font-size:17px;line-height:34px;z-index:2}
body.touring{overflow:hidden}
body.touring #map-frame{position:fixed;inset:0;height:auto;border-radius:0;z-index:10}
#tour{position:fixed;left:0;right:0;bottom:0;z-index:11;padding:0 12px calc(12px + env(safe-area-inset-bottom))}
.tour-card{max-width:560px;margin:0 auto;background:var(--card);border-radius:20px;padding:16px;box-shadow:0 6px 24px rgba(0,0,0,.25);position:relative}
#tour-close{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--line);color:var(--text);font-size:15px}
.tour-text{padding-right:40px}
.tour-text .num{margin-right:8px;vertical-align:2px}
.tour-text .memo{max-height:7.5em;overflow:auto}
.tour-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.tour-nav button{height:44px;padding:0 22px;border-radius:999px;border:0;font-weight:700}
#tour-prev{background:var(--line);color:var(--text)}
.tour-nav button:disabled{opacity:.35}
#tour-count{color:var(--sub);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="page" hidden>
<header class="wrap">
<h1 id="title"></h1>
<p class="sub" id="date"></p>
<p class="sub" id="regions"></p>
<p class="tags" id="tags"></p>
</header>
<section class="wrap" id="map-section" hidden>
<div id="map-frame"><div id="map"></div></div>
<p class="caption" id="route-note"></p>
<button type="button" id="tour-start" class="primary"></button>
</section>
<section class="wrap" id="note-section" hidden>
<h2 id="note-title"></h2>
<p class="note" id="note"></p>
</section>
<section class="wrap" id="places-section">
<h2 id="places-title"></h2>
<ol class="timeline" id="timeline"></ol>
</section>
</main>
<p class="message" id="message" hidden></p>
<footer class="wrap"><a id="made-with" href="https://apps.apple.com/app/id6831562941"></a></footer>
<div id="tour" hidden>
<div class="tour-card" role="dialog" aria-live="polite">
<button type="button" id="tour-close">✕</button>
<div class="tour-text"><span class="num"></span><time></time><h3></h3><p class="region"></p><p class="memo"></p></div>
<div class="tour-nav"><button type="button" id="tour-prev"></button><span id="tour-count"></span><button type="button" id="tour-next" class="primary"></button></div>
</div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function () {
  var TEXT = {
    ja: {
      tour: '▶ 思い出をたどる', places: '訪れた場所', notes: '思い出ノート', prev: '前へ', next: '次へ', close: '閉じる',
      routeNote: '線は訪問地点を時刻順に結んだ推定ルートです。実際の経路とは異なります。',
      madeWith: 'おでかけ日記アプリ Trippacy で作成',
      broken: 'リンクを読み込めませんでした。送られてきたリンクを、最後までそのまま開いてください。',
      old: 'このブラウザでは開けません。新しい Safari や Chrome で開いてください。'
    },
    en: {
      tour: '▶ Retrace', places: 'Places Visited', notes: 'Memory Notes', prev: 'Back', next: 'Next', close: 'Close',
      routeNote: 'Lines connect the places you visited in time order as an estimated route, not the actual path.',
      madeWith: 'Made with Trippacy, the outing diary app',
      broken: "Couldn't read this link. Please open the whole link exactly as it was sent.",
      old: "This browser can't open the link. Please try the latest Safari or Chrome."
    }
  };
  var browserLang = (navigator.language || '').slice(0, 2) === 'ja' ? 'ja' : 'en';
  function $(id) { return document.getElementById(id); }
  function fail(key, lang) {
    $('message').textContent = TEXT[lang || browserLang][key];
    $('message').hidden = false;
    $('made-with').textContent = TEXT[lang || browserLang].madeWith;
  }

  function decode(hash) {
    if (hash.charAt(0) !== '1') return Promise.reject(new Error('version'));
    var b64 = hash.slice(1).replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(stream).text().then(JSON.parse);
  }

  // 同じタブで別のリンクを開いたとき（「#」より後ろだけが変わる）も読み直す
  window.addEventListener('hashchange', function () { location.reload(); });

  var hash = location.hash.replace(/^#/, '');
  if (!hash) { fail('broken'); return; }
  if (typeof DecompressionStream === 'undefined') { fail('old'); return; }
  decode(hash).then(render).catch(function () { fail('broken'); });

  function render(data) {
    var lang = data.l === 'ja' ? 'ja' : 'en', text = TEXT[lang];
    document.documentElement.lang = lang;
    document.title = data.t || 'Trippacy';
    $('title').textContent = data.t || '';
    $('date').textContent = data.d || '';
    if (data.r) $('regions').textContent = data.r; else $('regions').remove();
    (data.g || []).forEach(function (tag) {
      var span = document.createElement('span'); span.textContent = '#' + tag; $('tags').appendChild(span);
    });
    if (!(data.g || []).length) $('tags').remove();
    if (data.m) { $('note-title').textContent = text.notes; $('note').textContent = data.m; $('note-section').hidden = false; }
    $('places-title').textContent = text.places;
    $('tour-start').textContent = text.tour;
    $('tour-prev').textContent = text.prev;
    $('tour-next').textContent = text.next;
    $('tour-close').setAttribute('aria-label', text.close);
    $('made-with').textContent = text.madeWith;

    var places = (data.p || []).map(function (p) {
      return { name: p[0] || '', region: p[1] || '', time: p[2] || '', day: p[3] || '', lat: +p[4], lng: +p[5], memo: p[6] || '' };
    });
    var lastDay = null;
    places.forEach(function (p, i) {
      if (p.day !== lastDay) {
        var day = document.createElement('li'); day.className = 'day'; day.textContent = p.day; $('timeline').appendChild(day);
        lastDay = p.day;
      }
      var li = document.createElement('li'); li.className = 'stop'; li.dataset.index = i;
      li.innerHTML = '<div class="rail"><span class="num"></span></div><div class="info"><time></time><h3></h3><p class="region"></p><p class="memo"></p></div>';
      li.querySelector('.num').textContent = i + 1;
      li.querySelector('time').textContent = p.time;
      li.querySelector('h3').textContent = p.name;
      var region = li.querySelector('.region'); if (p.region) region.textContent = p.region; else region.remove();
      var memo = li.querySelector('.memo'); if (p.memo) memo.textContent = p.memo; else memo.remove();
      $('timeline').appendChild(li);
    });
    if (!places.length) $('places-section').remove();
    $('page').hidden = false;

    if (!window.maplibregl || !places.length) return;
    setUpMap(data, places, text);
  }

  function setUpMap(data, places, text) {
    $('map-section').hidden = false;
    if (!data.nr && places.length > 1) $('route-note').textContent = text.routeNote; else $('route-note').remove();
    var map = new maplibregl.Map({
      container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [places[0].lng, places[0].lat], zoom: 13, cooperativeGestures: true, attributionControl: { compact: true }
    });
    var bounds = new maplibregl.LngLatBounds();
    var markers = places.map(function (p, i) {
      var el = document.createElement('div'); el.className = 'pin'; el.textContent = i + 1;
      el.addEventListener('click', function (e) { e.stopPropagation(); start(i); });
      bounds.extend([p.lng, p.lat]);
      return new maplibregl.Marker({ element: el }).setLngLat([p.lng, p.lat]).addTo(map);
    });
    function fitAll() {
      if (places.length > 1) map.fitBounds(bounds, { padding: 48, maxZoom: 15, duration: 0 });
      else map.jumpTo({ center: [places[0].lng, places[0].lat], zoom: 15 });
    }
    fitAll();

    map.on('load', function () {
      // 帰属表示は小さく畳んでおく（i ボタンで開ける）
      document.querySelectorAll('.maplibregl-ctrl-attrib').forEach(function (e) {
        e.classList.remove('maplibregl-compact-show'); e.removeAttribute('open');
      });
      if (data.nr || places.length < 2) return;
      var longHops = {}; (data.b || []).forEach(function (i) { longHops[i] = true; });
      var features = [], run = [[places[0].lng, places[0].lat]];
      for (var i = 0; i + 1 < places.length; i++) {
        var from = [places[i].lng, places[i].lat], to = [places[i + 1].lng, places[i + 1].lat];
        if (longHops[i]) {
          if (run.length > 1) features.push(line('local', run));
          features.push(line('long', [from, to]));
          run = [to];
        } else {
          run.push(to);
        }
      }
      if (run.length > 1) features.push(line('local', run));
      var color = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#C2502A';
      map.addSource('route', { type: 'geojson', data: { type: 'FeatureCollection', features: features } });
      map.addLayer({ id: 'route-local', type: 'line', source: 'route', filter: ['==', ['get', 'kind'], 'local'],
        layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': color, 'line-width': 4, 'line-opacity': 0.85 } });
      map.addLayer({ id: 'route-long', type: 'line', source: 'route', filter: ['==', ['get', 'kind'], 'long'],
        paint: { 'line-color': color, 'line-width': 3, 'line-opacity': 0.7, 'line-dasharray': [2, 2] } });
    });
    function line(kind, coordinates) {
      return { type: 'Feature', properties: { kind: kind }, geometry: { type: 'LineString', coordinates: coordinates } };
    }

    var tour = $('tour'), card = tour.querySelector('.tour-card'), current = -1;
    function show(i) {
      current = i;
      var p = places[i];
      tour.querySelector('.num').textContent = i + 1;
      tour.querySelector('time').textContent = p.time;
      tour.querySelector('h3').textContent = p.name;
      var region = tour.querySelector('.region'); region.textContent = p.region; region.hidden = !p.region;
      var memo = tour.querySelector('.memo'); memo.textContent = p.memo; memo.hidden = !p.memo;
      $('tour-count').textContent = (i + 1) + ' / ' + places.length;
      $('tour-prev').disabled = i === 0;
      $('tour-next').disabled = i === places.length - 1;
      markers.forEach(function (marker, j) { marker.getElement().classList.toggle('current', j === i); });
      requestAnimationFrame(function () {
        map.flyTo({ center: [p.lng, p.lat], zoom: Math.max(map.getZoom(), 15.5),
          padding: { top: 40, bottom: card.offsetHeight + 30, left: 20, right: 20 }, duration: 1200 });
      });
    }
    function start(i) {
      document.body.classList.add('touring'); tour.hidden = false;
      map.cooperativeGestures.disable(); map.resize(); show(i);
    }
    function stop() {
      document.body.classList.remove('touring'); tour.hidden = true; current = -1;
      map.cooperativeGestures.enable();
      markers.forEach(function (marker) { marker.getElement().classList.remove('current'); });
      map.resize(); fitAll(); $('map-section').scrollIntoView({ block: 'start' });
    }
    $('tour-start').addEventListener('click', function () { start(0); });
    $('tour-close').addEventListener('click', stop);
    $('tour-prev').addEventListener('click', function () { if (current > 0) show(current - 1); });
    $('tour-next').addEventListener('click', function () { if (current < places.length - 1) show(current + 1); });
    document.querySelectorAll('.stop').forEach(function (stopEl) {
      stopEl.addEventListener('click', function () { start(+stopEl.dataset.index); });
    });
    document.addEventListener('keydown', function (e) {
      if (current < 0) return;
      if (e.key === 'Escape') stop();
      else if (e.key === 'ArrowRight' && current < places.length - 1) show(current + 1);
      else if (e.key === 'ArrowLeft' && current > 0) show(current - 1);
    });
  }
})();
</script>
</body>
</html>
