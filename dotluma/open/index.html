<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>DotLuma - 共有された電光掲示板 | T.K Apps</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif; background: #f8f7ff; color: #29253f; line-height: 1.8; }
    header { background: linear-gradient(135deg, #f2efff 0%, #fff4f2 100%); text-align: center; padding: 48px 20px 40px; border-bottom: 1px solid #e6e0f8; }
    header .back { display: inline-block; margin-bottom: 16px; color: #6d6688; text-decoration: none; font-size: 0.9rem; }
    header h1 { font-size: 1.8rem; font-weight: 800; }
    header p { margin-top: 8px; color: #6d6688; }
    main { max-width: 820px; margin: 0 auto; padding: 44px 20px 72px; }
    .card { background: #fff; border: 1px solid #e9e5f8; border-radius: 16px; padding: 30px 32px; box-shadow: 0 8px 28px rgba(72, 58, 140, 0.08); margin-bottom: 24px; }
    h2 { color: #5d55d8; font-size: 1.08rem; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px solid #f0edff; }
    p { margin-bottom: 12px; font-size: 0.97rem; }
    p:last-child { margin-bottom: 0; }
    ul { padding-left: 20px; margin-bottom: 12px; font-size: 0.97rem; }
    .updated { text-align: right; color: #8d86a8; font-size: 0.85rem; margin-bottom: 24px; }
    .notice { background: #f0edff; border-left: 4px solid #5d55d8; border-radius: 0 10px 10px 0; padding: 14px 16px; }
    footer { text-align: center; padding: 32px 20px; color: #8d86a8; font-size: 0.85rem; }
    a { color: #5d55d8; }
    @media (max-width: 560px) { .card { padding: 24px 18px; } }
      table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th { background: #f0edff; color: #5d55d8; padding: 10px 12px; text-align: left; }
    td { padding: 10px 12px; border-bottom: 1px solid #e9e5f8; vertical-align: top; }
    .lang { display: inline-block; margin-top: 14px; font-size: 0.9rem; }
    @media (max-width: 560px) {
      table, tbody, tr, th, td { display: block; }
      td { border-bottom: none; }
      tr { border: 1px solid #e9e5f8; border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
    }
  
    .board { background: #000; color: #ff3b30; border-radius: 14px; padding: 28px 20px; text-align: center; font-size: 1.5rem; font-weight: 800; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow: hidden; margin-bottom: 20px; }
    .button { display: block; text-align: center; text-decoration: none; font-weight: 700; padding: 15px 16px; border-radius: 14px; margin-top: 12px; }
    .primary { background: #ff3b30; color: #fff; }
    .secondary { background: #f0edff; color: #5d55d8; }
    .hint { color: #6d6688; font-size: 0.88rem; margin-top: 14px; }
  </style>
</head>
<body>
<header>
  <h1 id="title">電光掲示板が届きました</h1>
  <p id="lead">DotLuma で開いて、再生や編集ができます</p>
</header>

<main>
  <div class="card">
    <div class="board" id="board" hidden></div>
    <a class="button primary" id="open" href="#">DotLuma で開く</a>
    <a class="button secondary" id="store" href="#">App Store で入手</a>
    <p class="hint" id="hint">アプリをお持ちでない場合は、App Store からインストールしたあと、もう一度このリンクを開いてください。</p>
  </div>
</main>

<footer>
  <p>&copy; 2026 T.K Apps &nbsp;|&nbsp; <a href="../index.html">DotLuma について</a> &nbsp;|&nbsp; <a id="privacy" href="../privacy-policy.html">プライバシーポリシー</a></p>
</footer>

<script>
  // Set this to the numeric Apple ID from App Store Connect once the app is live.
  const appStoreID = "6831186773";

  const fragment = location.hash.slice(1);
  const english = !navigator.language.toLowerCase().startsWith("ja");
  const $ = (id) => document.getElementById(id);

  if (english) {
    document.documentElement.lang = "en";
    document.title = "DotLuma - Shared Banner | T.K Apps";
    $("title").textContent = "You received a banner";
    $("lead").textContent = "Open it in DotLuma to play or edit it";
    $("open").textContent = "Open in DotLuma";
    $("store").textContent = "Get It on the App Store";
    $("hint").textContent = "Don't have the app? Install it from the App Store, then open this link again.";
    $("privacy").textContent = "Privacy Policy";
    $("privacy").href = "../privacy-policy-en.html";
  }

  const region = english ? "us" : "jp";
  $("store").href = appStoreID
    ? `https://apps.apple.com/${region}/app/id${appStoreID}`
    : `https://apps.apple.com/${region}/search?term=DotLuma`;

  if (appStoreID) {
    const banner = document.createElement("meta");
    banner.name = "apple-itunes-app";
    banner.content = `app-id=${appStoreID}`;
    document.head.append(banner);
  }

  if (fragment) {
    $("open").href = `dotluma://open#${fragment}`;
  } else {
    $("open").hidden = true;
  }

  // Shows the message so people know what they received. Everything stays in the browser.
  async function showPreview() {
    if (!fragment.startsWith("1.") || !("DecompressionStream" in window)) return;
    const base64 = fragment.slice(2).replaceAll("-", "+").replaceAll("_", "/");
    const bytes = Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    const banner = JSON.parse(await new Response(stream).text());
    const text = banner?.configuration?.text;
    if (typeof text === "string" && text.trim()) {
      $("board").textContent = text.slice(0, 200);
      $("board").hidden = false;
    }
  }
  showPreview().catch(() => {});
</script>
</body>
</html>
